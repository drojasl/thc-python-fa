
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is missing"; exit 1; }
          test -n "$VPS_HOST" || { echo "VPS_HOST is missing"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$VPS_USER" || { echo "VPS_USER is missing"; exit 1; }

          PROJECT="${GITHUB_REPOSITORY#*/}"

          echo "Deploying project: $PROJECT"

          ssh -i "$HOME/.ssh/deploy_key" \
            "$VPS_USER@$VPS_HOST" \
            "/usr/local/bin/deploy-challenge $PROJECT"
