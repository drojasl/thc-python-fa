
services:
  proxy:
    profiles:
      - traefik

  adminer:
    profiles:
      - adminer

  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:?Variable not set}:8000"
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:?Variable not set}
